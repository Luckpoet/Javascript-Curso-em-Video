<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas-Vindas</title>
</head>
<body>
    <h1>Boas-vindas!</h1>
    <button onclick="iniciar()">Iniciar Desafio</button>
</body>

<script>
function iniciar() {
    let nome = window.prompt("Qual é o seu nome?");
    let idade = window.prompt(`Olá, ${nome}! Qunatos anos você tem?`);
    window.alert(`Acabei de conhecer ${nome}, que tem ${idade} anos de idade!`);
}
</script>

</html>
